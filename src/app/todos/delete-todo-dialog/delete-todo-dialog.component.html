<h2 mat-dialog-title class="delete-title">
    Вы действительно хотите удалить пользователя: 
    <p class="delete-todo-name">
      <mat-icon>assignment_ind</mat-icon>
      {{ this.data.todo.title }}?
    </p>
  </h2>
  <mat-dialog-actions class="dialog-buttons-container">
    <button mat-button cdkFocusInitial [mat-dialog-close]="true" class="dialog-buttons" type="button">Удалить</button>
    <button mat-button mat-dialog-close class="dialog-buttons" type="button">Отмена</button>
  </mat-dialog-actions>
