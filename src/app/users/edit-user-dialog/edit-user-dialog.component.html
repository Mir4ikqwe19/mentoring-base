<h2 mat-dialog-title class="is_editing">User editing: {{ data.user.name }}</h2>
<form 
class="user-form"
[formGroup]="form"
>
<mat-form-field class="forms-size">
    <mat-label>Name:</mat-label>
    <input matInput formControlName="name">
</mat-form-field>

<mat-form-field>
    <mat-label>Email:</mat-label>
    <input matInput formControlName="email">
</mat-form-field>

<mat-form-field>
    <mat-label>Website:</mat-label>
    <input matInput formControlName="website">
</mat-form-field>

<div formGroupName="company">
    <mat-form-field class="forms-size">
        <mat-label>Company name:</mat-label>
        <input matInput formControlName="name">
    </mat-form-field>
</div>
<button 
class="edit-user-form-button" 
[disabled]="!form.valid" mat-button 
[mat-dialog-close]="userWithUpdatedFields"
type="button"
>
Edit user
</button>
</form>
