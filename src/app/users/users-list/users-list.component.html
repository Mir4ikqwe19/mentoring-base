<app-create-user-form (createUser)="createUser($event)"></app-create-user-form>
<div class="user-component-container">
    <button type="button" mat-button (click)="openCreateDialog()" class="create-user-button"> Add user
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="add"></mat-icon>
    </button>
    <div class="users-carts-container">
        <div *ngFor="let user of usersService.users$ | async">
            <app-user-card 
            [user]="user"
            (deleteUser)="deleteUser($event)"
            (editUser)="editUser($event)"
            ></app-user-card>
        </div>
    </div>
</div>
